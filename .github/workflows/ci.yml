name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Merging a contract-check bot PR only moves a baseline, a report or a
    # lock file; it must not cost a macOS build. The rest of the tool stays
    # covered: ContractCore.swift and read-set.json feed the tests and docs.
    paths-ignore:
      - "Tools/contract-check/baselines/**"
      - "Tools/contract-check/reports/**"
      - "Tools/contract-check/upstream/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails in seconds when AGENTS.md and the tree disagree (dead paths, drifted
  # inventories, a banned @Observable, a hardcoded per-user cache prefix).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check AGENTS.md against the tree
        run: python3 scripts/check-docs.py

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen || brew link xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          plutil -insert NSExtension \
            -json '{"NSExtensionPointIdentifier":"com.apple.widgetkit-extension"}' \
            TokenEaterWidget/Info.plist 2>/dev/null || true

      - name: Build (Release)
        run: |
          xcodebuild \
            -project TokenEater.xcodeproj \
            -scheme TokenEaterApp \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -project TokenEater.xcodeproj \
            -scheme TokenEaterTests \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            test
